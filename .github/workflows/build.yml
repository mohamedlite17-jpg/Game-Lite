name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Copy three.js into www
        run: |
          cp node_modules/three/build/three.min.js www/
          cp node_modules/three/examples/js/loaders/GLTFLoader.js www/
      - run: npx cap add android
      - name: Lock portrait
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && sed -i "s/networkTimeout=.*/networkTimeout=120000/" gradle/wrapper/gradle-wrapper.properties && chmod +x gradlew && export GRADLE_OPTS="-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000"; for i in 1 2 3; do ./gradlew assembleDebug && exit 0; sleep 15; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
